name: Rappor Security
on:
  push:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
      - name: Run Rappor Security
        shell: bash
        env:
          RAPPOR_CI_AUDIENCE: 'rappor-review-ci'
          RAPPOR_CI_CONFIGURATION_ID: '01a1f481-2519-7ba7-8d11-98fd051729bb'
          RAPPOR_CI_ORIGIN: 'https://linux-ai2.taile60a95.ts.net:10000'
          RAPPOR_AGENT_IMAGE: 'ghcr.io/renersilv/rappor-agent-self-hosted:sha-71e17746af61aeb229f7505c88813035e4fbd45b@sha256:7bafa2590878deab86293d5a5f96816f9a0910cccb592270a96f2606f7a5856f'
        run: |
          set -euo pipefail
          token_file="${RUNNER_TEMP}/rappor-oidc"
          cache_volume="rappor-trivy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          trap 'rm -f -- "${token_file}"; docker volume rm --force "${cache_volume}" >/dev/null 2>&1 || true' EXIT
          umask 077
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RAPPOR_CI_AUDIENCE}" \
            | jq -er '.value' > "${token_file}"
          docker volume create "${cache_volume}" >/dev/null
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=${cache_volume},dst=/cache" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --cache-dir /cache --db-repository \
            ghcr.io/aquasecurity/trivy-db@sha256:c21d571f915c471f4373095224a214186a30d0fc9e4ab956b31ce6147468332a \
            --download-db-only --no-progress
          docker run --rm --read-only --user "${runner_uid}:${runner_gid}" \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=512m,mode=0700,uid=${runner_uid},gid=${runner_gid}" \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            --mount "type=bind,src=${token_file},dst=/run/rappor/oidc,readonly" \
            --mount "type=volume,src=${cache_volume},dst=/var/lib/rappor-agent/trivy-db,readonly" \
            "${RAPPOR_AGENT_IMAGE}" ci --url "${RAPPOR_CI_ORIGIN}" \
            --configuration "${RAPPOR_CI_CONFIGURATION_ID}" \
            --commit "${GITHUB_SHA}" \
            --oidc-token-file /run/rappor/oidc --workspace /workspace
