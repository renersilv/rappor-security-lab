name: Rappor OIDC diagnostic
on:
  push:
permissions: {}
jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Inspect non-secret claim contract only
        shell: python
        run: |
          import os, json, urllib.request, base64, time
          request = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=rappor-review-ci", headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          allowed = ("iss", "aud", "sub", "repository_owner_id", "repository_id", "repository_owner", "repository", "sha", "ref", "workflow_ref", "job_workflow_ref", "workflow_sha", "actor_id", "event_name", "run_id", "run_attempt", "runner_environment", "iat", "nbf", "exp")
          output = {key: {"type": type(claims[key]).__name__, "value": claims[key]} for key in allowed if key in claims}
          output["observed_at"] = int(time.time())
          output["jti_present"] = isinstance(claims.get("jti"), str) and bool(claims["jti"])
          print(json.dumps(output, sort_keys=True))
